[project]
name = "painel-financeiro"
version = "1.0.0"
description = "API do painel financeiro pessoal: fluxo de caixa, cartões, dívidas, reserva e orçamento."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
